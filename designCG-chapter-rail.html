<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chapter Rail</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f8f4ed;color:#17140f;font-family:Inter,sans-serif}.layout{display:grid;grid-template-columns:120px 1fr}.rail{border-right:1px solid rgba(23,20,15,.12);padding:2rem 1rem;color:#8a7d72;text-transform:uppercase;letter-spacing:.16em;font-size:.8rem}.page{padding:2rem;display:grid;gap:2rem}.chapter{padding-bottom:2rem;border-bottom:1px solid rgba(23,20,15,.08)}.chapter h1,.chapter h2{margin:0;font-family:Newsreader,serif;line-height:.94}.chapter h1{font-size:clamp(3rem,6vw,5.2rem)}.chapter p{max-width:34rem;color:#5e554c;line-height:1.9}@media(max-width:900px){.layout{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid rgba(23,20,15,.12)}}</style></head><body><main class="layout"><aside class="rail">Chapters</aside><section class="page"><article class="chapter"><h1>Tell the startup through a clean chapter rail.</h1><p>Chapter Rail is calmer than story-board and more book-like than pitch-deck.</p></article><article class="chapter"><h2>Chapter Two</h2><p>Product as argument.</p></article></section></main></body></html>
