<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Thesis Mirror</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Rosarivo:ital@0;1&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#151316;color:#f6eef2;font-family:Inter,sans-serif}.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.left,.right{padding:3rem;display:grid;align-content:center}.left{border-right:1px solid rgba(255,255,255,.08)}.left h1,.right h2{margin:0;font-family:Rosarivo,serif;line-height:.94}.left h1{font-size:clamp(3.2rem,7vw,5.8rem)}.right h2{font-size:clamp(2.4rem,5vw,4.4rem)}.left p,.right p{max-width:28rem;color:#cdbec6;line-height:1.9}@media(max-width:900px){.split{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}}</style></head><body><main class="split"><section class="left"><h1>Let the startup face its own thesis in a mirror.</h1><p>One side states the claim. The other side tests it.</p></section><section class="right"><h2>Claim and consequence in the same frame.</h2><p>Useful when the brand should look self-aware rather than purely declarative.</p></section></main></body></html>
