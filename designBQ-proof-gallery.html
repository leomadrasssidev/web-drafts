<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Proof Gallery</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ec;color:#17130f;font-family:Inter,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem}.hero h1{margin:0;font-family:Newsreader,serif;font-size:clamp(3.6rem,7vw,6rem);line-height:.92;max-width:8ch}.hero p{max-width:34rem;color:#5c5249;line-height:1.9}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.4rem}.frame{padding:1rem;border:1px solid rgba(23,19,15,.1);background:#fff;border-radius:1.4rem;min-height:220px}.frame strong{display:block;margin-bottom:.35rem}@media(max-width:900px){.gallery{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><h1>Turn the company into a gallery of proofs instead of promises.</h1><p>Proof Gallery works when the product needs credibility more than spectacle.</p></section><section class="gallery"><div class="frame"><strong>Market proof</strong><span>Show category evidence.</span></div><div class="frame"><strong>Product proof</strong><span>Show interface quality.</span></div><div class="frame"><strong>Founder proof</strong><span>Show decision discipline.</span></div></section></main></body></html>
