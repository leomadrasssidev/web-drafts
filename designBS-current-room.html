<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Current Room</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0b1217;color:#eef6f9;font-family:Outfit,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-size:clamp(3.4rem,7vw,5.8rem);line-height:.92;max-width:8ch}.copy p{max-width:33rem;color:#bcccd4;line-height:1.9}.room{aspect-ratio:4/5;border-radius:2rem;background:linear-gradient(180deg,#111b23,#0a0f14);position:relative;overflow:hidden}.wave{position:absolute;left:-10%;right:-10%;height:2px;background:linear-gradient(90deg,transparent,#74ffd1,transparent)}.w1{top:26%}.w2{top:48%}.w3{top:70%}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Show the startup as a room full of current.</h1><p>Current Room is minimal but charged. It suggests energy distribution more than feature exposition.</p></div><div class="room"><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div></div></main></body></html>
