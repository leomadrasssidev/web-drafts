<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Frame Sequence</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Prata&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#181410;font-family:Inter,sans-serif}.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(340px,1fr);gap:1rem;overflow:auto;min-height:100vh;padding:2rem}.frame{border:1px solid rgba(24,20,16,.1);border-radius:1.8rem;background:#fff;padding:1.2rem}.frame h1,.frame h2{margin:0;font-family:Prata,serif;line-height:.95}.frame h1{font-size:clamp(3rem,6vw,5rem)}.frame p{color:#5e554c;line-height:1.8}</style></head><body><main class="rail"><section class="frame"><h1>Tell the startup in a sequence of still frames.</h1><p>Each frame is a frozen argument: thesis, product, proof, founder.</p></section><section class="frame"><h2>Frame 2</h2><p>The product enters.</p></section><section class="frame"><h2>Frame 3</h2><p>The proof locks it in.</p></section></main></body></html>
