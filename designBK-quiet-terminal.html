<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quiet Terminal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#111316;font-family:Inter,sans-serif}main{width:min(1140px,calc(100% - 2rem));margin:0 auto;min-height:100vh;display:grid;grid-template-columns:1fr .9fr;gap:2rem;align-items:center}.copy h1{margin:0;font-size:clamp(3.2rem,7vw,5.8rem);line-height:.92;max-width:8ch}.copy p{max-width:32rem;color:#59616a;line-height:1.9}.term{border:1px solid rgba(17,19,22,.12);border-radius:1.4rem;overflow:hidden;background:#ffffff;box-shadow:0 20px 50px rgba(32,40,47,.08)}.bar{padding:.8rem 1rem;background:#f0f2f4;font-family:"IBM Plex Mono",monospace;color:#66727e}.screen{padding:1rem;font-family:"IBM Plex Mono",monospace;color:#17222d;line-height:1.9}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>A terminal concept for founders who hate noisy cyber aesthetics.</h1><p>Quiet Terminal keeps the CLI posture but strips it down into something calmer and more premium.</p></div><div class="term"><div class="bar">startup.interface / calm mode</div><div class="screen">&gt; define category<br>&gt; clarify proof<br>&gt; reduce noise<br>&gt; ship conviction</div></div></main></body></html>
