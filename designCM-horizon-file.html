<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizon File</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#171b20;font-family:Inter,sans-serif}main{width:min(1160px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr .95fr;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-family:Marcellus,serif;font-size:clamp(3.4rem,7vw,5.8rem);line-height:.94;max-width:8ch}.copy p{max-width:33rem;color:#5a6671;line-height:1.9}.file{border:1px solid rgba(23,27,32,.1);border-radius:1.8rem;background:#fff;padding:1rem}.bar{height:180px;border-radius:1.2rem;background:linear-gradient(180deg,#c8d8e8,#edf1f4);position:relative;overflow:hidden}.bar:after{content:"";position:absolute;left:0;right:0;bottom:22%;height:2px;background:#171b20}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Give the startup one calm horizon and file everything beneath it.</h1><p>Horizon File is understated and directional, a good fit for mature product positioning.</p></div><div class="file"><div class="bar"></div></div></main></body></html>
