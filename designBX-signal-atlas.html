<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Signal Atlas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Marcellus&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0b1219;color:#eef6fa;font-family:Outfit,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-family:Marcellus,serif;font-size:clamp(3.4rem,7vw,5.8rem);line-height:.94;max-width:8ch}.copy p{max-width:33rem;color:#c0d0d8;line-height:1.9}.map{aspect-ratio:1;border-radius:2rem;border:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1rem}.zone{border:1px solid rgba(255,255,255,.08);border-radius:1.2rem;padding:1rem;background:rgba(255,255,255,.03)}@media(max-width:900px){main,.map{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Chart the company as an atlas of live signals.</h1><p>Signal Atlas is useful when the startup is better explained as interacting fields than a single proposition.</p></div><div class="map"><div class="zone">Vision</div><div class="zone">Product</div><div class="zone">Proof</div><div class="zone">Founder</div></div></main></body></html>
