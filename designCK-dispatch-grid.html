<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dispatch Grid</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0f1418;color:#f2f5f7;font-family:Inter,sans-serif}main{width:min(1200px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem}.hero h1{margin:0;font-size:clamp(3.4rem,7vw,5.8rem);line-height:.92;max-width:8ch}.hero p{max-width:33rem;color:#bcc7cc;line-height:1.9}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1.4rem}.card{padding:1rem;border-radius:1.2rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><h1>Dispatch the startup through a fast modular grid.</h1><p>Dispatch Grid is crisp, utilitarian, and built for quick signal routing.</p></section><section class="grid"><div class="card">Vision</div><div class="card">Product</div><div class="card">Proof</div><div class="card">Founder</div></section></main></body></html>
