<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Meridian Board</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Marcellus&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#e9e2d6;color:#181410;font-family:Inter,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;min-height:100vh;display:grid;grid-template-columns:1fr .95fr;gap:2rem;align-items:center}.copy h1{margin:0;font-family:Marcellus,serif;font-size:clamp(3.3rem,7vw,5.8rem);line-height:.94;max-width:8ch}.copy p{max-width:33rem;color:#5d544b;line-height:1.9}.board{border:1px solid rgba(24,20,16,.1);background:#f8f3ea;border-radius:1.8rem;padding:1rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}.pin{padding:1rem;border-radius:1.2rem;background:#fffdf8;border:1px solid rgba(24,20,16,.08)}@media(max-width:900px){main,.board{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Lay the startup out on a meridian board with visible coordinates.</h1><p>Meridian Board is spatial but tidy, ideal when you want orientation without heavy metaphor.</p></div><div class="board"><div class="pin">North / Market</div><div class="pin">East / Product</div><div class="pin">South / Proof</div><div class="pin">West / Founder</div></div></main></body></html>
