<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Axis Room</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0d1118;color:#f4f7fb;font-family:Sora,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-size:clamp(3.4rem,7vw,5.8rem);line-height:.92;max-width:8ch}.copy p{max-width:33rem;color:#c0c7d8;line-height:1.9}.axis{aspect-ratio:1;border-radius:2rem;border:1px solid rgba(255,255,255,.08);position:relative}.axis:before,.axis:after{content:"";position:absolute;background:rgba(255,255,255,.12)}.axis:before{left:50%;top:0;bottom:0;width:1px}.axis:after{top:50%;left:0;right:0;height:1px}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Center the startup on one visible axis of belief.</h1><p>Axis Room is stark and geometric. It gives the brand a rigorous, almost mathematical calm.</p></div><div class="axis"></div></main></body></html>
