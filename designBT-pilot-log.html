<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pilot Log</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#14181c;font-family:Inter,sans-serif}main{width:min(1140px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem}.sheet{border:1px solid rgba(20,24,28,.12);border-radius:1.6rem;background:#fff;overflow:hidden}.row{display:grid;grid-template-columns:160px 1fr;padding:1rem;gap:1rem;border-top:1px solid rgba(20,24,28,.08)}.row:first-child{border-top:0}.row b{font-family:"IBM Plex Mono",monospace;color:#6a7682}.hero{padding:2rem}.hero h1{margin:0;font-size:clamp(3.1rem,6vw,5.4rem);line-height:.94;max-width:8ch}.hero p{max-width:34rem;color:#58636f;line-height:1.9}@media(max-width:900px){.row{grid-template-columns:1fr}}</style></head><body><main><section class="sheet"><div class="hero"><h1>A startup tracked like a pilot’s log through changing air.</h1><p>Pilot Log is process-oriented, directional, and a little adventurous without becoming whimsical.</p></div><div class="row"><b>Heading</b><span>Category route set.</span></div><div class="row"><b>Altitude</b><span>Proof and traction visible.</span></div><div class="row"><b>Weather</b><span>Market conditions acknowledged, not ignored.</span></div></section></main></body></html>
