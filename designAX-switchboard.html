<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switchboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#121316;color:#f3f4f6;font-family:"Space Grotesk",sans-serif}main{width:min(1220px,calc(100% - 2rem));margin:0 auto;padding:1rem 0 3rem}.hero{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;min-height:92vh}.hero h1{margin:0;font-size:clamp(3.5rem,8vw,6.2rem);line-height:.92;letter-spacing:-.05em;max-width:8ch}.hero p{max-width:33rem;color:#b9c0c7;line-height:1.9}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding:1rem;border-radius:1.8rem;background:#0e0f12;border:1px solid rgba(255,255,255,.08)}.tile{aspect-ratio:1;border-radius:1.2rem;border:1px solid rgba(255,255,255,.08);padding:.9rem;background:rgba(255,255,255,.03);display:grid;align-content:space-between}.knob{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#79ffc8,#245847 70%);box-shadow:0 0 24px rgba(121,255,200,.18)}.tile span{color:#b9c0c7;line-height:1.6}.cta{display:inline-block;margin-top:1.4rem;padding:1rem 1.1rem;border-radius:999px;background:#f3f4f6;color:#121316;text-decoration:none;font-weight:700}@media(max-width:900px){.hero,.board{grid-template-columns:1fr}.tile{aspect-ratio:auto;min-height:160px}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div>
      <h1>Let the visitor route themselves through the startup.</h1>
      <p>Switchboard turns the homepage into a panel of live circuits: product, proof, vision, founder, market. It feels modular, tactile, and more active than a normal site flow.</p>
      <a class="cta" href="#">Patch signal</a>
    </div>
    <div class="board">
      <div class="tile"><div class="knob"></div><span>Vision line</span></div>
      <div class="tile"><div class="knob"></div><span>Product line</span></div>
      <div class="tile"><div class="knob"></div><span>Proof line</span></div>
      <div class="tile"><div class="knob"></div><span>Market line</span></div>
    </div>
  </section>
</main>
</body>
</html>
