<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Loop Theater</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#101219;color:#f4f7fb;font-family:Sora,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr .95fr;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-size:clamp(3.3rem,7vw,5.8rem);line-height:.92;max-width:8ch}.copy p{max-width:33rem;color:#c0c7d7;line-height:1.9}.loop{aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.1);position:relative}.loop:before,.loop:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08);inset:16%}.loop:after{inset:32%}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Show the startup as a theater of loops, not a ladder of steps.</h1><p>Loop Theater is useful when iteration and recurrence are part of the product’s intelligence.</p></div><div class="loop"></div></main></body></html>
