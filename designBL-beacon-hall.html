<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Beacon Hall</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Prata&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#14181f;color:#f6f7fb;font-family:Inter,sans-serif}main{width:min(1160px,calc(100% - 2rem));margin:0 auto;min-height:100vh;display:grid;grid-template-columns:1fr .95fr;gap:2rem;align-items:center}.copy h1{margin:0;font-family:Prata,serif;font-size:clamp(3.4rem,7vw,5.8rem);line-height:.94;max-width:8ch}.copy p{max-width:33rem;color:#c1c8d7;line-height:1.9}.hall{aspect-ratio:4/5;border-radius:2rem;background:linear-gradient(180deg,#1e2531,#10151d);position:relative;overflow:hidden}.hall:before{content:"";position:absolute;left:50%;top:12%;width:26%;height:52%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(255,230,176,.34),transparent 70%)}.hall:after{content:"";position:absolute;left:18%;right:18%;bottom:14%;height:16%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%)}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Give the startup a beacon at the end of a dark hall.</h1><p>Beacon Hall is simple but memorable. It suggests direction, arrival, and singular focus.</p></div><div class="hall"></div></main></body></html>
