<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Relay Mesh</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0c1013;color:#edf4f6;font-family:Outfit,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr .95fr;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-size:clamp(3.4rem,7vw,5.8rem);line-height:.92;max-width:8ch}.copy p{max-width:32rem;color:#b9c8cc;line-height:1.9}.mesh{aspect-ratio:1;border-radius:2rem;border:1px solid rgba(255,255,255,.08);position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01))}.point{position:absolute;width:18px;height:18px;border-radius:50%;background:#78ffd0}.p1{left:16%;top:22%}.p2{right:18%;top:28%}.p3{left:36%;bottom:18%}.line{position:absolute;height:2px;background:linear-gradient(90deg,rgba(120,255,208,.2),rgba(120,255,208,.9));transform-origin:left center}.l1{left:18%;top:25%;width:44%;transform:rotate(8deg)}.l2{left:22%;top:32%;width:28%;transform:rotate(52deg)}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Show the startup as a relay mesh of moving signals.</h1><p>Relay Mesh is useful when the brand needs to feel networked, active, and technically alive.</p></div><div class="mesh"><div class="point p1"></div><div class="point p2"></div><div class="point p3"></div><div class="line l1"></div><div class="line l2"></div></div></main></body></html>
