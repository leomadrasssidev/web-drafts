<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mission Deck</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0f1520;color:#eff4fb;font-family:Sora,sans-serif}main{width:min(1200px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem}.stack{display:grid;gap:1rem}.card{padding:1.2rem;border-radius:1.6rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}.hero{min-height:58vh;display:grid;align-content:end}.hero h1{margin:0;font-size:clamp(3.4rem,7vw,6rem);line-height:.92;max-width:8ch}.hero p,.card span{max-width:34rem;color:#bcc7d8;line-height:1.85}.rail{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}@media(max-width:900px){.rail{grid-template-columns:1fr}}</style></head><body><main><section class="stack"><div class="card hero"><h1>Turn the startup into a mission deck with clear operational cards.</h1><p>Mission Deck is compact, direct, and useful when the company should feel active and deployable.</p></div><div class="rail"><div class="card"><span>Mission thesis</span></div><div class="card"><span>Deployment proof</span></div><div class="card"><span>Launch command</span></div></div></section></main></body></html>
