<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Procession</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#171214;color:#f6eff2;font-family:Inter,sans-serif}.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;align-items:end;min-height:100vh;width:min(1220px,calc(100% - 2rem));margin:0 auto;padding:2rem 0}.column{min-height:42vh;padding:1rem;border:1px solid rgba(255,255,255,.08);border-radius:1.6rem;background:rgba(255,255,255,.03)}.column:first-child{min-height:74vh}.column h1{margin:0;font-family:Rosarivo,serif;font-size:clamp(2.4rem,5vw,4.4rem);line-height:.95}.column p,.column span{color:#d1c1c8;line-height:1.8}@media(max-width:900px){.rail{grid-template-columns:1fr}}</style></head><body><main class="rail"><section class="column"><h1>A startup that arrives in procession, not all at once.</h1><p>Each column advances the company one step further into view.</p></section><section class="column"><span>Vision</span></section><section class="column"><span>Product</span></section><section class="column"><span>Proof</span></section></main></body></html>
