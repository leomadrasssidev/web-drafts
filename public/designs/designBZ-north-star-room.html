<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>North Star Room</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0d1017;color:#f5f7fb;font-family:Sora,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr .95fr;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-size:clamp(3.4rem,7vw,5.8rem);line-height:.92;max-width:8ch}.copy p{max-width:32rem;color:#bec6d6;line-height:1.9}.room{aspect-ratio:1;border-radius:2rem;border:1px solid rgba(255,255,255,.08);position:relative;background:radial-gradient(circle at center,rgba(255,255,255,.04),transparent 55%)}.star{position:absolute;left:50%;top:22%;width:18px;height:18px;border-radius:50%;transform:translateX(-50%);background:#fff3b0;box-shadow:0 0 26px rgba(255,243,176,.7)}.line{position:absolute;left:50%;top:24%;bottom:20%;width:1px;background:rgba(255,255,255,.12)}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Give the company one visible north star and orient everything around it.</h1><p>North Star Room is spare, directional, and leadership-heavy.</p></div><div class="room"><div class="star"></div><div class="line"></div></div></main></body></html>
