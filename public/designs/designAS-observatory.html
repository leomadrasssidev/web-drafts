<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Marcellus&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#08111a;color:#eff6fb;font-family:Outfit,sans-serif;min-height:100vh;display:grid;place-items:center;padding:1rem}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at center,rgba(122,177,255,.1),transparent 28%),radial-gradient(circle at 20% 18%,rgba(255,171,92,.08),transparent 22%);pointer-events:none}
.scope{width:min(1180px,100%);display:grid;grid-template-columns:1fr 440px;gap:2rem;align-items:center}
.disc{aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.12);position:relative;background:radial-gradient(circle at center,rgba(255,255,255,.02),rgba(255,255,255,0) 62%)}.disc:before,.disc:after{content:"";position:absolute;inset:14%;border-radius:50%;border:1px solid rgba(255,255,255,.08)}.disc:after{inset:32%}
.cross{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.1)}.cross:after{content:"";position:absolute;left:-50vw;right:-50vw;top:50%;height:1px;background:rgba(255,255,255,.1)}
.target{position:absolute;padding:.9rem 1rem;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}.t1{left:18%;top:22%}.t2{right:14%;top:34%}.t3{left:34%;bottom:18%}
.copy h1{margin:0;font-family:Marcellus,serif;font-size:clamp(3.4rem,7vw,6rem);line-height:.92;letter-spacing:-.05em;max-width:8ch}.copy p{max-width:32rem;color:#bfd0dd;line-height:1.9}.copy a{display:inline-block;margin-top:1.4rem;padding:1rem 1.1rem;border-radius:999px;background:#eff6fb;color:#0c131b;text-decoration:none;font-weight:700}
@media(max-width:900px){.scope{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="scope">
  <div class="disc">
    <div class="cross"></div>
    <div class="target t1">Market anomaly</div>
    <div class="target t2">Product vector</div>
    <div class="target t3">Founder signal</div>
  </div>
  <div class="copy">
    <h1>Frame the startup as a field of signals under observation.</h1>
    <p>Observatory is restrained, spatial, and directional. It makes the company feel like a set of aligned vectors rather than a set of website sections.</p>
    <a href="#">Open scope</a>
  </div>
</main>
</body>
</html>
