<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Data Conservatory</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Prata&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#edf2ec;color:#171915;font-family:Inter,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-family:Prata,serif;font-size:clamp(3.2rem,7vw,5.8rem);line-height:.95;max-width:8ch}.copy p{max-width:33rem;color:#576055;line-height:1.9}.glass{aspect-ratio:4/5;border-radius:2rem;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.2));border:1px solid rgba(23,25,21,.1);padding:1rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}.pane{border-radius:1.2rem;background:rgba(255,255,255,.55);border:1px solid rgba(23,25,21,.08);padding:1rem}.pane strong{display:block;margin-bottom:.35rem}.pane span{color:#596257;line-height:1.7}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Treat the startup like a conservatory for cultivated data.</h1><p>This concept softens intelligence without losing seriousness. It feels tended, deliberate, and quietly premium.</p></div><div class="glass"><div class="pane"><strong>Signal growth</strong><span>Metrics are treated like living evidence.</span></div><div class="pane"><strong>Best fit</strong><span>Climate, health, education, or humane AI.</span></div></div></main></body></html>
