<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Foundry Table</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#efe8dd;color:#18130e;font-family:Inter,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem}.hero{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center}.hero h1{margin:0;font-family:Fraunces,serif;font-size:clamp(3.2rem,7vw,5.8rem);line-height:.94;max-width:8ch}.hero p{max-width:33rem;color:#5f564d;line-height:1.9}.table{padding:1rem;border-radius:1.8rem;border:1px solid rgba(24,19,14,.1);background:#f8f2e8;display:grid;gap:1rem}.slab{padding:1rem;border-radius:1.2rem;background:#fffdf8;border:1px solid rgba(24,19,14,.08)}.slab strong{display:block;margin-bottom:.35rem}.slab span{color:#625850;line-height:1.7}@media(max-width:900px){.hero{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><div><h1>Put the startup on the foundry table while it is being shaped.</h1><p>Foundry Table emphasizes formation and engineering rather than polish.</p></div><div class="table"><div class="slab"><strong>Material</strong><span>Category and product treated as raw matter under deliberate pressure.</span></div><div class="slab"><strong>Fit</strong><span>Industrial tech, climate, infra, AI tools.</span></div></div></section></main></body></html>
