<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pattern Atlas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Prata&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f6f2ea;color:#181512;font-family:Inter,sans-serif}main{width:min(1200px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem}.hero{display:grid;grid-template-columns:1fr .95fr;gap:2rem;align-items:center}.hero h1{margin:0;font-family:Prata,serif;font-size:clamp(3.2rem,7vw,5.6rem);line-height:.95;max-width:8ch}.hero p{max-width:33rem;color:#5d554c;line-height:1.9}.atlas{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.tile{padding:1rem;border:1px solid rgba(24,21,18,.1);border-radius:1.4rem;background:#fff}.tile strong{display:block;margin-bottom:.35rem}.tile span{color:#62584f;line-height:1.7}@media(max-width:900px){.hero,.atlas{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><div><h1>Present the startup like an atlas of repeatable patterns.</h1><p>Pattern Atlas works when the value of the company is not just the product but the system underneath it.</p></div><div class="atlas"><div class="tile"><strong>Pattern one</strong><span>How the company frames work.</span></div><div class="tile"><strong>Pattern two</strong><span>How proof accumulates.</span></div><div class="tile"><strong>Pattern three</strong><span>How trust compounds.</span></div></div></section></main></body></html>
