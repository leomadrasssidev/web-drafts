<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Atlas Strip</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#ece3d4;color:#181410;font-family:Inter,sans-serif}.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(320px,1fr);gap:1rem;overflow:auto;padding:2rem;width:100vw;min-height:100vh;align-items:center}.card{height:78vh;border:1px solid rgba(24,20,16,.1);border-radius:1.8rem;background:#f8f3ea;padding:1.4rem}.card h1,.card h2{margin:0;font-family:Marcellus,serif;line-height:.94}.card h1{font-size:clamp(3rem,6vw,5rem)}.card p{color:#5d544a;line-height:1.8;max-width:28rem}</style></head><body><main class="rail"><section class="card"><h1>A startup presented as an atlas strip of connected territories.</h1><p>Each card is a region of the company, encouraging lateral browsing instead of vertical scrolling.</p></section><section class="card"><h2>Category</h2><p>Map the new territory.</p></section><section class="card"><h2>Proof</h2><p>Show how the path holds.</p></section><section class="card"><h2>Founder</h2><p>Explain who is navigating.</p></section></main></body></html>
