<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Window Stack</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#e8edf1;color:#131820;font-family:Inter,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center}.copy h1{margin:0;font-size:clamp(3.3rem,7vw,5.8rem);line-height:.92;max-width:8ch}.copy p{max-width:32rem;color:#57626c;line-height:1.9}.stack{position:relative;height:520px}.win{position:absolute;border:1px solid rgba(19,24,32,.1);background:#fff;border-radius:1.2rem;padding:1rem;box-shadow:0 18px 44px rgba(49,62,76,.1)}.w1{left:0;top:40px;width:62%;height:220px}.w2{right:8%;top:0;width:48%;height:180px}.w3{left:16%;bottom:10px;width:58%;height:210px}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}.stack{height:620px}}</style></head><body><main><div class="copy"><h1>Let the startup stack like a set of active windows.</h1><p>Window Stack is softer than the desktop OS idea and more focused on layered attention than full simulation.</p></div><div class="stack"><div class="win w1">Primary thesis</div><div class="win w2">Product angle</div><div class="win w3">Trust and proof</div></div></main></body></html>
