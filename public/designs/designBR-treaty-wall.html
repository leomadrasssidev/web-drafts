<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Treaty Wall</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f0ede6;color:#181410;font-family:Inter,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center}.copy h1{margin:0;font-family:"Libre Baskerville",serif;font-size:clamp(3.3rem,7vw,5.8rem);line-height:.94;max-width:8ch}.copy p{max-width:33rem;color:#5b534a;line-height:1.9}.wall{padding:1rem;border:1px solid rgba(24,20,16,.12);border-radius:1.8rem;background:#fbf8f2;display:grid;gap:.8rem}.bar{padding:1rem;border-radius:1rem;background:#fff;border:1px solid rgba(24,20,16,.08)}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Let the startup read like a wall of agreed terms.</h1><p>Treaty Wall is flatter and more public than Treaty Table. It feels declarative and negotiated.</p></div><div class="wall"><div class="bar">The startup exists because the current market agreement is broken.</div><div class="bar">The product is the new term people accept.</div><div class="bar">The interface is the signature line.</div></div></main></body></html>
