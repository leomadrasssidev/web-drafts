<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Crown Index</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#141113;color:#f6eff2;font-family:Inter,sans-serif}main{width:min(1160px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr 420px;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-family:Rosarivo,serif;font-size:clamp(3.5rem,7vw,6rem);line-height:.92;max-width:8ch}.copy p{max-width:32rem;color:#d0c0c8;line-height:1.9}.crest{aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;position:relative}.crest:before,.crest:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08);inset:12%}.crest:after{inset:28%}.seal{width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#f0d18e,#9f6f2e)}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Give the startup the gravity of an index with a crown.</h1><p>Crown Index is about hierarchy, signal rank, and visible stature. It works when the company must feel like a category reference point.</p></div><div class="crest"><div class="seal"></div></div></main></body></html>
