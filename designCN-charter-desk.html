<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Charter Desk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#ede7dc;color:#17130f;font-family:Inter,sans-serif}main{width:min(1160px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-family:"Libre Baskerville",serif;font-size:clamp(3.2rem,7vw,5.8rem);line-height:.94;max-width:8ch}.copy p{max-width:33rem;color:#5c534b;line-height:1.9}.desk{padding:1rem;border:1px solid rgba(23,19,15,.1);border-radius:1.8rem;background:#faf6ef}.sheet{padding:1rem;border-radius:1.2rem;background:#fff;border:1px solid rgba(23,19,15,.08)}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Set the startup down like a charter on a desk.</h1><p>Charter Desk is measured, constitutional, and founder-authored.</p></div><div class="desk"><div class="sheet">A charter-driven homepage for companies that want clarity over spectacle.</div></div></main></body></html>
