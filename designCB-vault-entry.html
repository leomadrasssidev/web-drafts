<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vault Entry</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#111315;color:#f2f5f6;font-family:Inter,sans-serif}main{width:min(1160px,calc(100% - 2rem));margin:0 auto;display:grid;grid-template-columns:1fr 420px;gap:2rem;align-items:center;min-height:100vh}.copy h1{margin:0;font-family:Fraunces,serif;font-size:clamp(3.3rem,7vw,5.8rem);line-height:.94;max-width:8ch}.copy p{max-width:33rem;color:#bbc4c7;line-height:1.9}.vault{aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;position:relative}.vault:before,.vault:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08);inset:12%}.vault:after{inset:28%}.core{width:22%;aspect-ratio:1;border-radius:50%;background:#d4b27d}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Make the startup feel like entry into a protected vault of value.</h1><p>Vault Entry works when exclusivity, trust, and preservation matter more than velocity theater.</p></div><div class="vault"><div class="core"></div></div></main></body></html>
