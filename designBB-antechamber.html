<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antechamber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Canela:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#120f11;color:#f7f0eb;font-family:Manrope,sans-serif;min-height:100vh;display:grid;place-items:center;padding:1rem}.hall{width:min(1120px,100%);display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center}.door{aspect-ratio:3/4;border-radius:220px 220px 1.6rem 1.6rem;background:linear-gradient(180deg,#2c2327,#161214);border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden}.door:before{content:"";position:absolute;left:50%;top:18%;width:46%;height:46%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,235,196,.22),transparent 68%)}.door:after{content:"";position:absolute;right:18%;top:54%;width:14px;height:14px;border-radius:50%;background:#d2b17c}.copy h1{margin:0;font-size:clamp(3.4rem,7vw,6rem);line-height:.92;letter-spacing:-.05em;max-width:8ch}.copy p{max-width:33rem;color:#c9bab4;line-height:1.9}.cta{display:inline-block;margin-top:1.4rem;padding:1rem 1.1rem;border-radius:999px;background:#f7f0eb;color:#171314;text-decoration:none;font-weight:700}@media(max-width:900px){.hall{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="hall">
  <div class="door"></div>
  <div class="copy">
    <h1>Make the startup feel like an antechamber to something important.</h1>
    <p>Antechamber is about withholding, restraint, and anticipation. It works when the brand should feel selective, serious, and worth stepping into carefully.</p>
    <a class="cta" href="#">Enter chamber</a>
  </div>
</main>
</body>
</html>
