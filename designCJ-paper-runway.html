<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Paper Runway</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Prata&family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f4efe7;color:#171410;font-family:Inter,sans-serif}main{width:min(1160px,calc(100% - 2rem));margin:0 auto;min-height:100vh;display:grid;grid-template-columns:1fr .95fr;gap:2rem;align-items:center}.copy h1{margin:0;font-family:Prata,serif;font-size:clamp(3.3rem,7vw,5.8rem);line-height:.94;max-width:8ch}.copy p{max-width:33rem;color:#5d544b;line-height:1.9}.strip{height:420px;border-radius:1.8rem;background:linear-gradient(180deg,#fffdf8,#ece2d5);border:1px solid rgba(23,20,16,.1);position:relative;overflow:hidden}.strip:before{content:"";position:absolute;left:18%;right:18%;top:50%;height:2px;background:rgba(23,20,16,.12)}@media(max-width:900px){main{grid-template-columns:1fr;padding:2rem 0}}</style></head><body><main><div class="copy"><h1>Blend runway confidence with paper-like restraint.</h1><p>Paper Runway keeps the reveal metaphor but grounds it in editorial calm.</p></div><div class="strip"></div></main></body></html>
