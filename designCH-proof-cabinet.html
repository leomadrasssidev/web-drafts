<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Proof Cabinet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=EB+Garamond:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#efe9df;color:#17130f;font-family:Inter,sans-serif}main{width:min(1180px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem}.hero{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center}.hero h1{margin:0;font-family:"EB Garamond",serif;font-size:clamp(3.4rem,7vw,5.8rem);line-height:.92;max-width:8ch}.hero p{max-width:33rem;color:#5d544c;line-height:1.9}.cab{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.cell{padding:1rem;border:1px solid rgba(23,19,15,.1);border-radius:1.2rem;background:#fffdf8;min-height:180px}.cell strong{display:block;margin-bottom:.35rem}@media(max-width:900px){.hero,.cab{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><div><h1>Store the company’s best arguments in a proof cabinet.</h1><p>Each drawer holds one reason to believe.</p></div><div class="cab"><div class="cell"><strong>Market</strong><span>Evidence of timing.</span></div><div class="cell"><strong>Product</strong><span>Evidence of care.</span></div></div></section></main></body></html>
