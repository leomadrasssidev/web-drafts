<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Station Map</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Marcellus&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f1f3f4;color:#14181d;font-family:Inter,sans-serif}main{width:min(1200px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem}.hero h1{margin:0;font-family:Marcellus,serif;font-size:clamp(3.2rem,7vw,5.8rem);line-height:.94;max-width:9ch}.hero p{max-width:34rem;color:#5d6670;line-height:1.9}.line{height:6px;border-radius:999px;background:linear-gradient(90deg,#ff7c61,#ffc24d,#7cffc4,#73a5ff);margin:1.6rem 0;position:relative}.stop{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#14181d;transform:translate(-50%,-50%)}.s1{left:12%}.s2{left:38%}.s3{left:66%}.s4{left:88%}</style></head><body><main><section class="hero"><h1>Arrange the startup like a map of connected stations.</h1><p>Station Map is simple, public, and navigable. It suggests movement through a network of ideas rather than a single stack of sections.</p><div class="line"><div class="stop s1"></div><div class="stop s2"></div><div class="stop s3"></div><div class="stop s4"></div></div></section></main></body></html>
